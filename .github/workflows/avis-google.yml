name: Avis Google

# Chaque jour vers 6h17 (heure de Paris en hiver) + bouton "Run workflow" pour lancer à la main
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj-avis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer les avis Google
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          PLACE_ID: ${{ vars.PLACE_ID }}
        run: node scripts/avis-google.mjs

      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avis.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour automatique des avis Google"
            git push
          fi
